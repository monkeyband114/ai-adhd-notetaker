service: adhd-notes-api

plugins:
  - serverless-dotenv-plugin
  - serverless-offline

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    MONGO_URI: ${mongodb+srv://dangerdinstack:TI2hSilpVgS1X2fB@cluster0.soefctu.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0}

functions:
  createNote:
    handler: functions/createNote.handler
    events:
      - http:
          path: notes
          method: post
          cors: true

  getNotes:
    handler: functions/getNotes.handler
    events:
      - http:
          path: notes
          method: get
          cors: true

  updateNote:
    handler: functions/updateNote.handler
    events:
      - http:
          path: notes/{id}
          method: put
          cors: true

  deleteNote:
    handler: functions/deleteNote.handler
    events:
      - http:
          path: notes/{id}
          method: delete
          cors: true

  summarizeNote:
    handler: functions/summarizeNote.handler
    events:
      - http:
          path: summarize
          method: post
          cors: true
